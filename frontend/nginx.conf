# ÖNDER Burs Kayıt - frontend konteyneri Nginx ayarı
#
#   /          React uygulaması (bilinmeyen adresler index.html'e düşer: /basvuru/..., /admin/...)
#   /api/      backend konteynerine (backend:4000) aktarılır
#   /phpmyadmin/  phpmyadmin konteynerine aktarılır (veritabanı yönetimi)
#
# HTTPS bu konteynerde değil, sunucudaki Nginx'te (Let's Encrypt) yapılır.
# Sunucu Nginx'i X-Forwarded-For ve X-Forwarded-Proto başlıklarını göndermeli;
# backend'de TRUST_PROXY=2 (sunucu Nginx'i + bu Nginx) gerçek istemci IP'sini verir.

# Dışarıdaki proxy HTTPS bilgisini gönderdiyse onu kullan, yoksa bu bağlantının şeması
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

server {
    listen 80;
    server_name _;
    server_tokens off;
    absolute_redirect off;   # yönlendirmelerde iç port (80) görünmesin

    root /usr/share/nginx/html;
    index index.html;

    # Belgeler en fazla 5 MB (form alanlarıyla birlikte biraz pay)
    client_max_body_size 6m;

    gzip on;
    gzip_comp_level 5;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # Güvenlik başlıkları (bu sunucunun tüm cevaplarına)
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://challenges.cloudflare.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; font-src 'self' data:; connect-src 'self'; frame-src 'self' blob: https://challenges.cloudflare.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    # Docker'ın iç DNS'i: backend konteyneri yeniden oluşturulursa yeni IP'si bulunur
    resolver 127.0.0.11 valid=10s ipv6=off;

    # --- API -----------------------------------------------------------------
    location /api/ {
        set $backend http://backend:4000;
        proxy_pass $backend;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;   # Excel dışa aktarımı büyük olabilir
        proxy_send_timeout    60s;

        # Backend kendi güvenlik başlıklarını (helmet) gönderir; tekrarlanmasın
        proxy_hide_header X-Powered-By;
        proxy_hide_header X-Content-Type-Options;
        proxy_hide_header X-Frame-Options;
        proxy_hide_header Referrer-Policy;
        proxy_hide_header Strict-Transport-Security;
    }

    # --- phpMyAdmin --------------------------------------------------------------
    location = /phpmyadmin {
        return 301 /phpmyadmin/;
    }
    location /phpmyadmin/ {
        set $pma http://phpmyadmin:80;
        rewrite ^/phpmyadmin/(.*)$ /$1 break;
        proxy_pass $pma;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;
        proxy_set_header Connection        "";

        # SQL içe aktarma için büyük dosya
        client_max_body_size 64m;
        proxy_read_timeout 300s;

        # phpMyAdmin kendi betiklerini kullanır: sitenin sıkı CSP'si burada uygulanmaz
        # (bu blokta add_header olduğu için üstteki başlıklar devralınmaz)
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "same-origin" always;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # --- Statik dosyalar --------------------------------------------------------
    # Vite dosya adlarına içerik özeti ekler (index-AbC123.js): uzun süre önbellekte kalabilir
    location /assets/ {
        expires 1y;
        access_log off;
        try_files $uri =404;
    }

    # index.html her zaman güncel alınır (yeni sürüm yayınlanınca hemen görünsün)
    location = /index.html {
        expires -1;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    # Gizli dosyalar (.env, .git vb.) asla sunulmaz
    location ~ /\. {
        deny all;
        return 404;
    }
}
