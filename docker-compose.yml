# ÖNDER Çift Kanatlı Nesil Burs Programı - Başvuru Sistemi
#
#   db        MariaDB 10.11 (veriler "db_data" volume'unda)
#   backend   Node.js API (belgeler "uploads" volume'unda)
#   frontend  React + Nginx; sadece sunucunun içinden (127.0.0.1:WEB_PORT) erişilir,
#             dışarıya sunucu Nginx'i (HTTPS) üzerinden açılır
#   phpmyadmin  veritabanı yönetimi: https://<site>/phpmyadmin/ (frontend Nginx'i üzerinden)
#
# Ayarlar: bu klasördeki .env dosyası (.env.example'dan kopyalayın)
#
#   İlk kurulum:
#     docker compose up -d --build
#     docker compose exec backend npx knex seed:run
#     docker compose exec backend npm run admin:create -- e-posta@onder.org.tr "Ad Soyad" 05XXXXXXXXX
#   Güncelleme:
#     git pull && docker compose up -d --build     (migration'lar backend açılırken otomatik çalışır)

name: burs-kayit

services:
  db:
    image: mariadb:10.11
    restart: unless-stopped
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_turkish_ci
      - --default-time-zone=+00:00
    environment:
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?DB_ROOT_PASSWORD .env içinde tanımlı olmalı}
      MARIADB_DATABASE: ${DB_NAME:-burs_kayit}
      MARIADB_USER: ${DB_USER:-burs}
      MARIADB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD .env içinde tanımlı olmalı}
    volumes:
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    # Dışarıya port açılmaz. Sunucudan bağlanmak için: docker compose exec db mariadb -u root -p

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: .env
    environment:
      NODE_ENV: production
      DB_HOST: db
      DB_PORT: 3306
      UPLOAD_DIR: /app/storage/uploads
    volumes:
      - uploads:/app/storage/uploads
    depends_on:
      db:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

  phpmyadmin:
    image: phpmyadmin:5.2
    restart: unless-stopped
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
      # Site alt yolunda çalıştığı için tam adres (yönlendirmeler ve cookie yolu buna göre)
      PMA_ABSOLUTE_URI: ${PMA_ABSOLUTE_URI:?PMA_ABSOLUTE_URI .env içinde tanımlı olmalı}
      UPLOAD_LIMIT: 64M
      HIDE_PHP_VERSION: "true"
    depends_on:
      db:
        condition: service_healthy
    # Port açılmaz; sadece frontend Nginx'i /phpmyadmin/ yolundan erişir

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      # Sadece sunucunun kendisi erişir (Docker portları UFW'yi atlar; 0.0.0.0 yapmayın)
      - "127.0.0.1:${WEB_PORT:-8090}:80"
    depends_on:
      backend:
        condition: service_healthy
    logging:
      driver: json-file
      options: { max-size: "20m", max-file: "5" }

volumes:
  db_data:
  uploads:
